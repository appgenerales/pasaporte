# Prueba, publica las reglas de Firestore y despliega el sitio en GitHub Pages.
# Pages admite un solo sitio por repositorio: se publican las dos ramas juntas,
#   main    -> https://<usuario>.github.io/pasaporte/
#   sandbox -> https://<usuario>.github.io/pasaporte/sandbox/  (modo pruebas, js/evento.js)
# Ambas usan el mismo proyecto de Firebase: las reglas que quedan publicadas son
# las de la última rama que hizo push. En pull requests solo corre las pruebas.
# Requisitos:
#   - Settings > Pages > Source: "GitHub Actions".
#   - Secreto FIREBASE_SERVICE_ACCOUNT (JSON de la cuenta de servicio) para
#     publicar las reglas. Sin él, el sitio se despliega igual y avisa.
name: Desplegar

on:
  push:
    branches: [main, sandbox]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desplegar-${{ github.ref }}
  cancel-in-progress: false

env:
  FIREBASE_TOOLS: firebase-tools@13.29.1
  PROYECTO: pasaporte-itm

jobs:
  pruebas:
    name: Pruebas
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pruebas/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Sintaxis de JavaScript
        run: for f in js/*.js tools/*.mjs pruebas/*.mjs; do node --check "$f"; done

      - name: Instalar dependencias de pruebas
        run: npm ci --prefix pruebas

      - name: Reglas de Firestore (emulador)
        run: npx --yes "$FIREBASE_TOOLS" emulators:exec --only firestore --project "$PROYECTO" "node pruebas/reglas.test.mjs"

  reglas:
    name: Publicar reglas de Firestore
    needs: pruebas
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/sandbox')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Credenciales de Firebase
        id: credenciales
        env:
          CUENTA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$CUENTA" ]; then
            echo "::warning::Falta el secreto FIREBASE_SERVICE_ACCOUNT: las reglas NO se publicaron."
            echo "omitir=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$CUENTA" > "$RUNNER_TEMP/cuenta.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/cuenta.json" >> "$GITHUB_ENV"

      - name: Publicar firestore.rules
        if: steps.credenciales.outputs.omitir != '1'
        run: npx --yes "$FIREBASE_TOOLS" deploy --only firestore:rules --project "$PROYECTO" --non-interactive

  sitio:
    name: Desplegar sitio
    needs: pruebas
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/sandbox')
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # trae las dos ramas

      # Solo lo que se sirve: sin PDFs de referencia, scripts ni pruebas.
      - name: Armar el sitio (main en la raíz, sandbox en /sandbox/)
        run: |
          armar() {
            mkdir -p "$2/tools"
            (cd "$1" && cp -r index.html pasaporte.html scanner.html admin.html constancia.html css js assets "$2/")
            cp "$1/tools/generar-qrs.html" "$2/tools/"
          }
          git worktree add "$RUNNER_TEMP/main" origin/main
          armar "$RUNNER_TEMP/main" "$PWD/_sitio"
          if git rev-parse --verify --quiet origin/sandbox >/dev/null; then
            git worktree add "$RUNNER_TEMP/sandbox" origin/sandbox
            armar "$RUNNER_TEMP/sandbox" "$PWD/_sitio/sandbox"
          fi
          touch _sitio/.nojekyll
          du -sh _sitio _sitio/sandbox 2>/dev/null || true

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _sitio

      - name: Desplegar en GitHub Pages
        id: despliegue
        uses: actions/deploy-pages@v5
