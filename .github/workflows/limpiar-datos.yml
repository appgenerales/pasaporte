# Borra los datos de los estudiantes (para repetir pruebas desde cero).
# Se lanza a mano: Actions > "Limpiar datos de prueba" > Run workflow.
# Conserva los tokens de stands y mentores, las fechas y las cuentas de los
# organizadores. Requiere el secreto FIREBASE_SERVICE_ACCOUNT del ambiente
# (Sandbox para sandbox-pasaporte, Produccion para pasaporte-itm).
name: Limpiar datos de prueba

on:
  workflow_dispatch:
    inputs:
      proyecto:
        description: 'Proyecto de Firebase'
        type: choice
        options: [sandbox-pasaporte, pasaporte-itm]
        default: sandbox-pasaporte
      confirmacion:
        description: 'Escribe BORRAR para confirmar'
        required: true
        type: string
      borrar_cuentas:
        description: 'Borrar también las cuentas (correo y contraseña) de los estudiantes'
        type: boolean
        default: true
      simular:
        description: 'Solo contar lo que se borraría, sin borrar nada'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: limpiar-datos
  cancel-in-progress: false

jobs:
  limpiar:
    name: Limpiar datos
    runs-on: ubuntu-24.04
    environment: ${{ inputs.proyecto == 'pasaporte-itm' && 'Produccion' || 'Sandbox' }}
    steps:
      - name: Confirmación
        if: inputs.confirmacion != 'BORRAR' && !inputs.simular
        run: |
          echo "::error::Para borrar escribe exactamente BORRAR en la confirmación (o marca 'simular')."
          exit 1

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Instalar firebase-admin
        run: npm ci --prefix tools

      - name: Credenciales de Firebase
        env:
          CUENTA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$CUENTA" ]; then
            echo "::error::Falta el secreto FIREBASE_SERVICE_ACCOUNT en el ambiente (Settings > Environments)."
            exit 1
          fi
          printf '%s' "$CUENTA" > "$RUNNER_TEMP/cuenta.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/cuenta.json" >> "$GITHUB_ENV"

      - name: Borrar datos
        env:
          CUENTAS: ${{ inputs.borrar_cuentas && '--cuentas' || '' }}
          SIMULAR: ${{ inputs.simular && '--simular' || '' }}
          PROYECTO: ${{ inputs.proyecto }}
        run: node tools/limpiar-datos.mjs "--proyecto=$PROYECTO" $CUENTAS $SIMULAR | tee -a "$GITHUB_STEP_SUMMARY"
