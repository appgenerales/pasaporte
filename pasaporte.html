<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102d6a">
  <title>Mi Pasaporte CUEE 2.0</title>
  <link rel="icon" href="assets/sellos/epm.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Montserrat:wght@400;500;600;700;800&family=Roboto+Mono:wght@700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="assets/paginas/00-portada.webp">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/vendor/page-flip-2.0.7.browser.js" defer></script>
</head>
<body>
  <div id="cargando" class="cargador">
    <div>
      <div class="girando" style="margin: 0 auto 14px"></div>
      Abriendo tu pasaporte…
    </div>
  </div>

  <div id="escena" class="escena oculto">
    <header class="barra">
      <a class="marca" href="pasaporte.html" aria-label="Pasaporte CUEE 2.0">
        <small>PASAPORTE</small>
        <strong>CUEE <span>2.0</span></strong>
      </a>
      <div class="progreso" aria-live="polite">
        <span id="progreso-texto">0 de 8 destinos</span>
        <div class="progreso-anillo" id="anillo"><span id="progreso-num">0/8</span></div>
      </div>
    </header>

    <div class="libro-zona" id="libro-zona">
      <div id="libro-marco"><div id="libro" class="cargando"></div></div>
    </div>

    <nav class="navegacion" aria-label="Pasar hojas">
      <button class="btn btn-secundario btn-icono" id="anterior" aria-label="Hoja anterior">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="indicador" id="indicador"></div>
      <button class="btn btn-secundario btn-icono" id="siguiente" aria-label="Hoja siguiente">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </nav>

    <div class="acciones">
      <a class="btn btn-primario" href="scanner.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M8 8h3v3H8zM13 13h3v3h-3zM13 8h3M8 16h2"/></svg>
        Escanear sello
      </a>
    </div>
  </div>

  <div class="girar-celular" aria-hidden="true">
    <div>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>
      <div>Gira tu celular para leer tu pasaporte</div>
    </div>
  </div>

  <div id="aviso" class="aviso" role="status"></div>

  <dialog id="dlg-datos">
    <form method="dialog" class="dialogo-cuerpo" id="form-datos">
      <h2>Datos del titular</h2>
      <p>Así aparecen en la hoja de datos de tu pasaporte.</p>
      <label class="campo-form"><span>Apellidos</span><input name="apellidos" required maxlength="80"></label>
      <label class="campo-form"><span>Nombres</span><input name="nombres" required maxlength="80"></label>
      <label class="campo-form"><span>Programa académico</span><input name="programa" required maxlength="120"></label>
      <label class="campo-form"><span>Empresa <em>(opcional)</em></span><input name="empresa" maxlength="120"></label>
      <label class="campo-form"><span>Correo institucional o documento</span><input name="contacto" class="sin-mayus" required maxlength="120"></label>
      <div class="dialogo-botones">
        <button class="btn btn-claro" value="cancelar" formnovalidate>Cancelar</button>
        <button class="btn btn-primario" value="guardar">Guardar</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlg-firma">
    <div class="dialogo-cuerpo">
      <h2>Firma del titular</h2>
      <p>Firma con el dedo dentro del recuadro.</p>
      <canvas id="lienzo-firma" class="lienzo-firma"></canvas>
      <div class="dialogo-botones">
        <button class="btn btn-claro" id="firma-limpiar" type="button">Borrar</button>
        <button class="btn btn-claro" id="firma-cancelar" type="button">Cancelar</button>
        <button class="btn btn-primario" id="firma-guardar" type="button">Guardar</button>
      </div>
    </div>
  </dialog>

  <input type="file" id="input-foto" accept="image/*" capture="user" hidden>

  <script type="module" src="js/pasaporte-ui.js"></script>
</body>
</html>
