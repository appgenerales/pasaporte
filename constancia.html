<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102d6a">
  <title>Mi constancia · CUEE 2.0</title>
  <link rel="icon" href="assets/sellos/epm.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
  <style>
    .constancia-cuerpo { max-width: 980px; margin: 0 auto; padding: 4px 16px 32px; text-align: center; }
    .constancia-cuerpo h1 { font-size: 22px; margin: 8px 0 4px; }
    .constancia-cuerpo > p { margin: 0 0 16px; opacity: .85; }
    .vista { width: 100%; border-radius: 10px; box-shadow: var(--sombra); display: block; background: #fff; }
    .botones-constancia { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
    .pendientes { background: var(--papel); color: var(--texto); border-radius: 18px; padding: 20px; text-align: left; max-width: 520px; margin: 0 auto; box-shadow: var(--sombra); }
    .pendientes h2 { margin: 0 0 6px; color: var(--azul-titulo); font-size: 18px; }
    .pendientes ul { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 6px; }
    .pendientes li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 12px; border-radius: 10px; background: #fff; font-weight: 600; font-size: 14px; }
    .pendientes li span { font-weight: 700; }
    .pendientes .si { color: var(--ok); }
    .pendientes .no { color: #a3aec4; }
  </style>
</head>
<body>
  <header class="barra" style="max-width:980px;margin:0 auto">
    <a class="marca" href="pasaporte.html" aria-label="Volver al pasaporte">
      <small>PASAPORTE</small>
      <strong>CUEE <span>2.0</span></strong>
    </a>
    <a class="btn btn-secundario" href="pasaporte.html">Mi pasaporte</a>
  </header>

  <main class="constancia-cuerpo">
    <div id="cargando" class="cargador" style="min-height:50dvh">
      <div><div class="girando" style="margin:0 auto 14px"></div>Preparando tu constancia…</div>
    </div>

    <section id="vista-lista" class="oculto">
      <h1>¡Misión cumplida!</h1>
      <p>Esta es tu constancia de abordaje y participación en Pasantías CUEE 2.0.</p>
      <img id="vista" class="vista" alt="Constancia de abordaje y participación">
      <div class="botones-constancia">
        <button class="btn btn-primario" id="descargar-pdf" type="button">Descargar PDF</button>
        <button class="btn btn-secundario" id="descargar-img" type="button">Descargar imagen</button>
      </div>
    </section>

    <section id="vista-pendiente" class="oculto">
      <h1>Tu constancia aún no está lista</h1>
      <p>Se habilita al registrar la asistencia de los 3 días y sellar todos los stands.</p>
      <div class="pendientes">
        <h2 id="pendiente-resumen"></h2>
        <ul id="pendiente-lista"></ul>
      </div>
      <div class="botones-constancia">
        <a class="btn btn-primario" href="scanner.html">Escanear QR</a>
      </div>
    </section>
  </main>

  <script type="module" src="js/constancia.js"></script>
</body>
</html>
